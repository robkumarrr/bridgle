services:

  # ── PHP-FPM application ────────────────────────────────────────────────────
  # Built from our Dockerfile — contains the compiled app + built frontend assets.
  # Never exposed to the internet directly; nginx talks to it over FastCGI on
  # the internal bridgle-network.
  bridgle-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridgle-app
    restart: unless-stopped
    volumes:
      # Share built frontend assets with nginx (see below for how this works).
      - public_build:/var/www/html/public/build
      # Persist Laravel's runtime cache/session/view dirs across deploys.
      - storage_framework:/var/www/html/storage/framework
      # Persist logs so they survive container restarts and image rebuilds.
      - storage_logs:/var/www/html/storage/logs
    env_file: .env.production
    networks:
      - bridgle-network
      - web-proxy # Connect to web-proxy to reach the global-db

  # ── nginx web server ───────────────────────────────────────────────────────
  # The only container that faces the internet (port 80).
  # Serves public/build/ assets directly (no PHP involved).
  # Forwards all .php requests to bridgle-app via FastCGI.
  bridgle-nginx:
    image: nginx:alpine
    container_name: bridgle-nginx
    restart: unless-stopped
    # No ports exposed! The external web-proxy handles public traffic
    # and routes it internally to port 80 of this container.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only mount of the shared built assets volume.
      # On first boot, Docker populates this from the app image's public/build/.
      - public_build:/var/www/html/public/build:ro
    depends_on:
      - bridgle-app
    networks:
      - bridgle-network
      - web-proxy

networks:
  bridgle-network:
    name: bridgle-network
  web-proxy:
    external: true

volumes:
  # Built Vite assets (public/build/). Populated from the app image on first start,
  # then shared read-only with nginx. Survives deploys without needing to rebuild nginx.
  public_build:

  # Laravel's runtime directories — written to at request time, must persist.
  storage_framework:
  storage_logs:

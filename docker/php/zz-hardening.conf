; Extra FPM pool hardening, loaded after the image's own zz-docker.conf.
; Applied to web requests only — artisan/composer on the CLI are unaffected.
[www]
; Nothing in the app shells out. Blocking these stops canned exploit kits from
; turning a PHP bug into a shell. Not a hard boundary against memory-corruption
; exploits, but it raises the bar a lot.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

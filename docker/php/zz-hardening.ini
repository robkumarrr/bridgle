; Don't advertise the PHP version in an X-Powered-By header (makes us less
; interesting to version-fingerprinting scanners).
expose_php = Off
allow_url_include = Off

; Workarounds from the CVE-2026-109618/109619 advisory, kept as cheap
; defence-in-depth since bridgle has no file uploads.
session.upload_progress.enabled = 0
post_max_size = 8M
upload_max_filesize = 2M

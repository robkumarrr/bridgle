server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Maintenance switch that works while PHP is running: `touch maintenance/on`
    # next to docker-compose.prod.yml takes the site offline, `rm` brings it back.
    # Requests from inside this container (127.0.0.1) skip it, for smoke tests.
    # Only `set` at server level — internal redirects to /maintenance.html re-run these.
    set $maintenance 0;
    if (-f /etc/nginx/maintenance/on) { set $maintenance 1; }
    if ($remote_addr = 127.0.0.1)    { set $maintenance 0; }

    location / {
        if ($maintenance) { return 503; }
        try_files $uri @php;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location @php {
        fastcgi_pass bridgle-app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # If PHP-FPM is down (or deliberately stopped for maintenance), serve a static
    # page with a proper 503 instead of nginx's bare 502.
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        internal;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

services:
  bridgle-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bridgle-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    env_file:
      - .env
    depends_on:
      - bridgle-db

  bridgle-nginx:
    image: nginx:alpine
    container_name: bridgle-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - bridgle-app

  bridgle-vite:
    image: node:22-alpine
    container_name: bridgle-vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    ports:
      - "5173:5173"

  bridgle-db:
    image: postgres:16
    container_name: bridgle-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bridgle_db
      POSTGRES_USER: bridgle
      POSTGRES_PASSWORD: secret
    volumes:
      - bridgle-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

networks:
  default:
    name: bridgle-network

volumes:
  bridgle-db-data:
